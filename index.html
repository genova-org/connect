<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Подключение</title>
<style>
  :root { --bg:#fafaf8; --fg:#111; --card:#fff; --line:#e2e2de; --muted:#999; --btn:#1f6f5c; --btn-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --card:#1e1e1e; --line:#333; --muted:#777; --btn:#2f8f77; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:420px; margin:0 auto; padding:32px 16px; }
  #msg { margin:0 0 16px; }
  .app { display:flex; align-items:center; gap:14px; padding:12px 16px; margin:0 0 10px; border:1px solid var(--line);
         border-radius:14px; background:var(--card); color:var(--fg); text-decoration:none; font:inherit; }
  .app img { width:44px; height:44px; border-radius:10px; flex:none; }
  .app::after { content:"›"; margin-left:auto; color:var(--muted); font-size:24px; }
  .btn { display:block; width:100%; padding:14px; margin:0 0 10px; border:0; border-radius:12px; background:var(--btn);
         color:var(--btn-fg); font:inherit; cursor:pointer; }
  .hidden { display:none; }
  input { width:100%; padding:12px; margin:0 0 10px; border:1px solid var(--line); border-radius:10px;
          background:var(--card); color:var(--fg); font:14px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <p id="msg">Выберите используемое приложение</p>

  <div id="apps" class="hidden">
    <a class="app" id="b-v2raytun" href="#"><img src="icons/v2raytun.png" alt="">V2RayTun</a>
    <a class="app" id="b-happ" href="#"><img src="icons/happ.png" alt="">Happ</a>
  </div>

  <div id="desktop" class="hidden">
    <input id="sub" readonly>
    <button class="btn" id="copy" type="button">Скопировать</button>
  </div>
</main>
<script>
(function () {
  // Link format: https://<host>/#<subId>[/v2raytun|/happ|/auto] — the fragment never reaches any server.
  var SUB_BASE = 'https://panel.albertjane.ru:2096/sub/';
  var APPS = ['v2raytun', 'happ'];
  var PKG = { v2raytun: 'com.v2raytun.android', happ: 'com.happproxy' };
  var TRY_MS = 2500; // /auto on iOS: how long to wait for the app to take over before trying the next one

  var $ = function (id) { return document.getElementById(id); };
  function say(text) { $('msg').textContent = text; }

  var parts = location.hash.slice(1).split('/');
  var subId = parts[0], mode = parts[1] || '';
  var chosen = APPS.indexOf(mode) >= 0 ? mode : null;
  if (!/^[a-z0-9]{8,32}$/.test(subId)) {
    say('Ссылка неполная, попросите прислать её ещё раз');
    return;
  }

  var subUrl = SUB_BASE + subId;
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  if (!isAndroid && !isIOS) {
    say('Скопируйте адрес и добавьте его в приложение через «+»');
    $('sub').value = subUrl;
    $('copy').onclick = function () {
      $('sub').select();
      (navigator.clipboard ? navigator.clipboard.writeText(subUrl) : Promise.reject())
        .catch(function () { document.execCommand('copy'); })
        .then(function () { $('copy').textContent = 'Скопировано'; });
    };
    $('desktop').classList.remove('hidden');
    return;
  }

  var deep = {
    v2raytun: 'v2raytun://import/' + subUrl,
    happ: 'happ://add/' + encodeURIComponent(subUrl)
  };

  // Android: intent:// opens the app if installed, otherwise the browser comes back with ?step=<next>.
  function intent(app, next) {
    var back = location.origin + location.pathname + '?step=' + next + '#' + parts.join('/');
    return 'intent://' + deep[app].replace(/^[a-z0-9]+:\/\//, '') + '#Intent;scheme=' + app +
           ';package=' + PKG[app] + ';S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
  }
  function link(app) { return isAndroid ? intent(app, 'none') : deep[app]; }

  APPS.forEach(function (app) { $('b-' + app).href = link(app); });

  var step = new URLSearchParams(location.search).get('step');
  if (step === 'none') {
    say('Приложение не найдено, установите V2RayTun или Happ');
    $('apps').classList.remove('hidden');
    return;
  }

  // Experimental iOS probe (#subId/auto): open each app in turn; a missing one makes Safari show an error,
  // so the page moves on only if it is still visible after TRY_MS.
  $('apps').classList.remove('hidden');

  if (mode === 'auto' && isIOS) {
    var left = false;
    document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
    window.addEventListener('pagehide', function () { left = true; });
    var i = 0;
    (function next() {
      if (left || i >= APPS.length) return;
      location.href = deep[APPS[i++]];
      setTimeout(next, TRY_MS);
    })();
    return;
  }

  // Auto-open only where it cannot show an error: the app named in the link, or Android's intent chain.
  var auto = null;
  if (chosen) {
    auto = link(chosen);
  } else if (isAndroid) {
    auto = step === 'happ' ? intent('happ', 'none') : intent('v2raytun', 'happ');
  }
  if (auto) setTimeout(function () { location.href = auto; }, 150);
})();
</script>
</body>
</html>
